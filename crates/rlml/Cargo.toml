[package]
name = "rlml"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rlml"
path = "src/main.rs"

[dependencies]
rlml-core = { path = "../rlml-core" }
rlml-tui = { path = "../rlml-tui" }

[features]
# the interpreter's counters in `rlml bench` (rlml-core's `stats`)
stats = ["rlml-core/stats"]
