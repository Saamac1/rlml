# The STD minigame in the browser on GitHub Pages: every push to main is
# tested, built with crates/rlml-web/build.sh and published to the
# gh-pages branch, which Pages serves at https://saamac1.github.io/rlml/.
# The branch holds only the last build.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# one publish at a time; a newer push waits for the one under way
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # the same version as rlml-web's wasm-bindgen dependency
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      # gilrs, the terminal's pad reader, needs udev to build natively
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Tests
        run: cargo test --workspace

      - name: Build
        run: crates/rlml-web/build.sh esimerkit/mini

      - name: Publish to gh-pages
        run: |
          site=$(mktemp -d)
          cd crates/rlml-web/www
          cp -r index.html main.js worker.js game.json pkg "$site"/
          cd "$site"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "The STD minigame in the browser, built from main ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
